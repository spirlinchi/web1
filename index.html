<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web1</title>
<style>
  :root { --bg:#111; --fg:#eee; --muted:#888; --line:#2a2a2a; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  #status { color:var(--muted); margin-bottom:12px; font-size:12px; }
  #grid { display:grid; gap:4px; }
  .cell { aspect-ratio:1; border:1px solid var(--line); overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; padding:6px; font-size:12px; text-align:center; }
  .cell img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
  .ref { position:absolute; top:2px; left:4px; font-size:10px; color:var(--muted); mix-blend-mode:difference; z-index:1; }
</style>
</head>
<body>
<div id="status">Carico…</div>
<div id="grid"></div>
<script>
const DATA = 'data/data.json';
const $ = s => document.querySelector(s);
let lastUpdated = null;

async function load() {
  try {
    const d = await (await fetch(DATA + '?t=' + Date.now())).json();
    if (d.updated !== lastUpdated) { lastUpdated = d.updated; render(d); }
  } catch (e) {
    $('#status').textContent = 'Nessun dato ancora pubblicato (' + e.message + ')';
  }
}

function render(d) {
  $('#status').textContent = `${d.cells.length} celle · aggiornato ${new Date(d.updated).toLocaleString('it-IT')}`;
  const grid = $('#grid');
  grid.style.gridTemplateColumns = `repeat(${d.cols}, minmax(60px, 1fr))`;
  grid.innerHTML = '';
  for (let r = 0; r < d.rows; r++) for (let c = 0; c < d.cols; c++) {
    const el = document.createElement('div');
    el.className = 'cell';
    const cell = d.cells.find(x => x.row === r && x.col === c);
    if (cell) {
      el.innerHTML = `<span class="ref">${cell.ref}</span>`;
      if (cell.type === 'image') {
        const img = new Image();
        img.src = cell.src ? 'data/' + cell.src : cell.url;
        img.alt = cell.ref;
        el.appendChild(img);
      } else if (cell.type === 'color') {
        el.style.background = cell.value;
      } else {
        el.append(cell.value || '');
        if (cell.bg && cell.bg !== '#ffffff') el.style.background = cell.bg;
      }
    }
    grid.appendChild(el);
  }
}

load();
setInterval(load, 60000); // controlla nuovi dati ogni minuto
</script>
</body>
</html>
